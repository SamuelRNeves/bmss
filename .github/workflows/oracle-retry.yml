# Fica tentando criar a VM Always Free "bmss" na Oracle Cloud até conseguir
# (até ~5h40 por execução). Roda de graça no GitHub, sem depender do seu computador.
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   OCI_USER, OCI_TENANCY, OCI_FINGERPRINT, OCI_REGION, OCI_PRIVATE_KEY
name: Oracle - criar VM

on:
  push:
    branches: [oracle-retry]   # qualquer push nesta branch reinicia as tentativas
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"   # só vale quando estiver na branch padrão

concurrency:
  group: oracle-retry
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPPRESS_LABEL_WARNING: "True"
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  criar-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Instalar OCI CLI
        run: pip install --quiet oci-cli

      - name: Configurar credenciais
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Limpa espaços, quebras de linha e prefixos como "user=" colados por engano
          clean() { printf '%s' "$1" | tr -d '\r\n\t ' | sed -E "s/^$2=//"; }
          U="$(clean "$OCI_USER" user)"
          T="$(clean "$OCI_TENANCY" tenancy)"
          F="$(clean "$OCI_FINGERPRINT" fingerprint)"
          R="$(clean "$OCI_REGION" region)"
          ok=1
          [[ "$U" == ocid1.user.* ]]    || { echo "❌ OCI_USER deve começar com ocid1.user."; ok=0; }
          [[ "$T" == ocid1.tenancy.* ]] || { echo "❌ OCI_TENANCY deve começar com ocid1.tenancy."; ok=0; }
          [[ "$F" =~ ^([0-9a-f]{2}:){15}[0-9a-f]{2}$ ]] || { echo "❌ OCI_FINGERPRINT deve ter o formato aa:bb:...(16 pares)"; ok=0; }
          [[ "$R" =~ ^[a-z]{2}-[a-z]+-[0-9]$ ]] || { echo "❌ OCI_REGION deve ser algo como sa-saopaulo-1"; ok=0; }
          mkdir -p "$HOME/.oci"
          KEY="$HOME/.oci/key.pem"
          printf '%s\n' "$OCI_PRIVATE_KEY" | tr -d '\r' > "$KEY"
          grep -q -- "-----BEGIN" "$KEY" && grep -q -- "-----END" "$KEY" || { echo "❌ OCI_PRIVATE_KEY precisa ter as linhas -----BEGIN ...----- e -----END ...-----"; ok=0; }
          [[ $ok == 1 ]] || exit 1
          grep -q '^OCI_API_KEY$' "$KEY" || echo "OCI_API_KEY" >> "$KEY"
          chmod 600 "$KEY"
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' "$U" "$F" "$T" "$R" "$KEY" > "$HOME/.oci/config"
          chmod 600 "$HOME/.oci/config"
          echo "OCI_TENANCY=$T" >> "$GITHUB_ENV"
          echo "✓ Formato dos secrets ok. Testando acesso à Oracle..."
          oci iam region-subscription list --tenancy-id "$T" --query 'data[0]."region-name"' --raw-output

      - name: Tentar criar a VM até conseguir
        run: bash deploy/oracle/retry-create-vm.sh
