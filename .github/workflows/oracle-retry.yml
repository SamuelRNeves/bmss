# Fica tentando criar a VM Always Free "bmss" na Oracle Cloud até conseguir
# (até ~5h40 por execução). Roda de graça no GitHub, sem depender do seu computador.
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   OCI_USER, OCI_TENANCY, OCI_FINGERPRINT, OCI_REGION, OCI_PRIVATE_KEY
name: Oracle - criar VM

on:
  push:
    branches: [oracle-retry]   # qualquer push nesta branch reinicia as tentativas
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"   # só vale quando estiver na branch padrão

concurrency:
  group: oracle-retry
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPPRESS_LABEL_WARNING: "True"
  OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: "True"

jobs:
  criar-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Instalar OCI CLI
        run: pip install --quiet oci-cli

      - name: Configurar credenciais
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Procura cada valor pelo formato em todos os secrets juntos — funciona
          # mesmo se o bloco inteiro do "Configuration file preview" foi colado
          # ou se os valores ficaram trocados entre os secrets.
          ALL="$(printf '%s\n%s\n%s\n%s' "$OCI_USER" "$OCI_TENANCY" "$OCI_FINGERPRINT" "$OCI_REGION" | tr -d '\r')"
          U="$(grep -oE 'ocid1\.user\.[A-Za-z0-9._-]+' <<<"$ALL" | head -1 || true)"
          T="$(grep -oE 'ocid1\.tenancy\.[A-Za-z0-9._-]+' <<<"$ALL" | head -1 || true)"
          F="$(grep -oE '([0-9a-f]{2}:){15}[0-9a-f]{2}' <<<"$ALL" | head -1 || true)"
          R="$(grep -oE '[a-z]{2}-[a-z]+-[0-9]' <<<"$ALL" | grep -v '^oc' | head -1 || true)"
          ok=1
          [[ -n "$U" ]] || { echo "❌ Não achei o OCID do usuário (ocid1.user...) em nenhum secret"; ok=0; }
          [[ -n "$T" ]] || { echo "❌ Não achei o OCID da tenancy (ocid1.tenancy...) em nenhum secret"; ok=0; }
          [[ -n "$F" ]] || { echo "❌ Não achei o fingerprint (aa:bb:... 16 pares) em nenhum secret"; ok=0; }
          [[ -n "$R" ]] || R="sa-saopaulo-1"
          mkdir -p "$HOME/.oci"
          KEY="$HOME/.oci/key.pem"
          # Reconstrói o PEM (resolve chave colada numa linha só, com espaços ou recuos)
          printf '%s' "$OCI_PRIVATE_KEY" | python3 -c '
          import re, sys, textwrap
          raw = sys.stdin.read()
          m = re.search(r"-{3,}\s*BEGIN ([A-Z ]+?)\s*-{3,}(.*?)-{3,}\s*END [A-Z ]+?\s*-{3,}", raw, re.S)
          if not m:
              sys.exit("❌ OCI_PRIVATE_KEY precisa ter as linhas -----BEGIN ...----- e -----END ...-----")
          kind, body = m.group(1).strip(), re.sub(r"[^A-Za-z0-9+/=]", "", m.group(2))
          if "PUBLIC" in kind:
              sys.exit("❌ OCI_PRIVATE_KEY contém a chave PÚBLICA; use o arquivo da chave privada")
          if "ENCRYPTED" in kind or "Proc-Type" in raw:
              sys.exit("❌ A chave privada está protegida por senha; gere uma sem senha")
          print(f"-----BEGIN {kind}-----"); print("\n".join(textwrap.wrap(body, 64))); print(f"-----END {kind}-----")
          ' > "$KEY" || ok=0
          [[ $ok == 1 ]] || exit 1
          grep -q '^OCI_API_KEY$' "$KEY" || echo "OCI_API_KEY" >> "$KEY"
          chmod 600 "$KEY"
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' "$U" "$F" "$T" "$R" "$KEY" > "$HOME/.oci/config"
          chmod 600 "$HOME/.oci/config"
          echo "OCI_TENANCY=$T" >> "$GITHUB_ENV"
          echo "✓ Formato dos secrets ok. Testando acesso à Oracle..."
          oci iam region-subscription list --tenancy-id "$T" --query 'data[0]."region-name"' --raw-output

      - name: Tentar criar a VM até conseguir
        run: bash deploy/oracle/retry-create-vm.sh
