# Compila as imagens Docker do BMSS e publica no GitHub Container Registry.
# A VM (AMD Micro, 1 GB) só baixa as imagens prontas — compilar Java lá é lento demais.
name: Imagens Docker

on:
  push:
    branches: [prod, migracao-oracle-cloud]
    paths:
      - "backend/**"
      - ".github/workflows/docker-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: bmss-backend
            context: backend/backend
            dockerfile: backend/backend/Dockerfile
          - image: bmss-sentiment-lite
            context: backend/bmss-sentiment
            dockerfile: backend/bmss-sentiment/Dockerfile.lite
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/samuelrneves/${{ matrix.image }}:latest
            ghcr.io/samuelrneves/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
