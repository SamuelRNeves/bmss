# ===============================
# 🔗 POSTGRES DATABASE (RENDER)
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# 🔧 TIMEZONE & LOGS
# ===============================
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
logging.level.com.bmss=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# 🤖 SENTIMENT BACKEND (PYTHON)
# ===============================
bmss.sentiment.flask-url=https://bmss-sentiment.onrender.com/analyze-batch
bmss.sentiment.tweets-url=https://bmss-sentiment.onrender.com/analyze-tweets

# ===============================
# 📰 NEWS API CONFIGS
# ===============================
newsapi.apiKey=2397c71979b14eaea433a03179807359
news.fetch.windowHours=36
news.fetch.defaultLimit=12

# ===============================
# 🚀 FLYWAY (Desabilitado temporariamente)
# ===============================
spring.flyway.enabled=false

# ===============================
# ✉️ RESEND EMAIL (API - NÃO PRECISA DE SMTP)
# ===============================
resend.api.key=${RESEND_API_KEY}

# ===============================
# 🔐 JWT SECRET
# ===============================
jwt.secret=CC7JqXNIA7Lp0vkpOjOT0YZ3eiVdzvvUjfVjwm1jOsn3eJkQ==

# ===============================
# ☁️ CLOUDINARY
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===============================
# 🌐 SERVER CONFIG (RENDER)
# ===============================
server.port=${PORT:8080}
server.servlet.context-path=/