# ===============================
# 🎯 SPRING PROFILES
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ===============================
# 🔗 POSTGRES DATABASE
# ===============================
# Aceita jdbc:postgresql://... ou postgresql://... (veja DatabaseConfig)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ===============================
# 🔧 TIMEZONE & LOGS
# ===============================
spring.jackson.time-zone=America/Sao_Paulo
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.bmss=INFO

# ===============================
# 🤖 SENTIMENT BACKEND (PYTHON)
# ===============================
# local = palavras-chave dentro do Java (padrão, sem serviço Python)
# remote = chama o microserviço Python (com modelo de IA)
bmss.sentiment.mode=${BMSS_SENTIMENT_MODE:local}
bmss.sentiment.flask-url=${BMSS_SENTIMENT_BASE_URL:http://localhost:5000}/analyze-batch
bmss.sentiment.tweets-url=${BMSS_SENTIMENT_BASE_URL:http://localhost:5000}/analyze-tweets

# ===============================
# 📰 NEWS API CONFIGS
# ===============================
newsapi.apiKey=${NEWSAPI_API_KEY}
news.fetch.windowHours=3
news.fetch.defaultLimit=12

# ===============================
# 🚀 FLYWAY
# ===============================
spring.flyway.enabled=false

# ===============================
# ✉️ RESEND EMAIL
# ===============================
resend.api.key=${RESEND_API_KEY}

resend.from.email=${RESEND_FROM_EMAIL}


# ===============================
# 🔐 JWT SECRET
# ===============================
jwt.secret=${JWT_SECRET}

# ===============================
# ☁️ CLOUDINARY
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ===============================
# 🌐 SERVER CONFIG
# ===============================
server.port=${PORT:8080}
server.servlet.context-path=/
