spring.datasource.url=jdbc:mysql://localhost:3306/bmss_db
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.security.user.name=admin
spring.security.user.password=123456

# Para tratar timezones corretamente
spring.jackson.time-zone=America/Sao_Paulo
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

newsapi.apiKey=${NEWS_API_KEY:}
newsdata.apiKey=${NEWSDATA_API_KEY:}
news.rss.backup-url=https://rss.app/feeds/v1.1/bitcoin-news.xml
news.fetch.windowHours=36
news.fetch.defaultLimit=12
