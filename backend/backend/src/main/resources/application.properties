# ===============================
# 🔗 POSTGRES DATABASE (RENDER)
# ===============================
spring.datasource.url=jdbc:postgresql://${DATABASE_URL}:5432/bmss_db
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===============================
# 🔧 TIMEZONE & LOGS
# ===============================
spring.jackson.time-zone=America/Sao_Paulo
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# 🔐 EMAIL
# ===============================
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# 🤖 SENTIMENT BACKEND (PYTHON)
# ===============================
bmss.sentiment.flask-url=https://bmss-sentiment.onrender.com/analyze-batch
bmss.sentiment.tweets-url=https://bmss-sentiment.onrender.com/analyze-tweets


# ===============================
# 📰 NEWS API CONFIGS
# ===============================
newsapi.apiKey=2397c71979b14eaea433a03179807359
news.fetch.windowHours=36
news.fetch.defaultLimit=12


spring.flyway.enabled=false
resend.api.key=${RESEND_API_KEY}
