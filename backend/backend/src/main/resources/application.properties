# ===============================
# 🎯 SPRING PROFILES
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ===============================
# 🔗 POSTGRES DATABASE (RENDER) - CORRIGIDO!
# ===============================
# A DATABASE_URL do Render já inclui porta e nome do banco
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ===============================
# 🔧 TIMEZONE & LOGS
# ===============================
spring.jackson.time-zone=America/Sao_Paulo
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.bmss=INFO

# ===============================
# 🤖 SENTIMENT BACKEND (PYTHON)
# ===============================
bmss.sentiment.flask-url=https://bmss-sentiment.onrender.com/analyze-batch
bmss.sentiment.tweets-url=https://bmss-sentiment.onrender.com/analyze-tweets

# ===============================
# 📰 NEWS API CONFIGS
# ===============================
newsapi.apiKey=2397c71979b14eaea433a03179807359
news.fetch.windowHours=36
news.fetch.defaultLimit=12

# ===============================
# 🚀 FLYWAY
# ===============================
spring.flyway.enabled=false

# ===============================
# ✉️ RESEND EMAIL
# ===============================
resend.api.key=${RESEND_API_KEY}

resend.from.email=${RESEND_FROM_EMAIL:BMSS Alerts <onboarding@resend.dev>}

