# ===============================
# 🎯 SPRING PROFILES
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ===============================
# 🔗 POSTGRES DATABASE (RENDER) - CORRIGIDO!
# ===============================
# O Render fornece DATABASE_URL no formato: postgresql://user:pass@host:5432/dbname
# NÃO adicione jdbc: na frente - use as variáveis separadas!
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bmss_db}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}

# OU use esta abordagem alternativa (mais simples):
# spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bmss_db}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# ===============================
# 🔧 TIMEZONE & LOGS
# ===============================
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
logging.level.com.bmss=INFO

# ===============================
# 🤖 SENTIMENT BACKEND (PYTHON)
# ===============================
bmss.sentiment.flask-url=${BMSS_SENTIMENT_BASE_URL:https://bmss-sentiment.onrender.com}/analyze-batch
bmss.sentiment.tweets-url=${BMSS_SENTIMENT_BASE_URL:https://bmss-sentiment.onrender.com}/analyze-tweets

# ===============================
# 📰 NEWS API CONFIGS
# ===============================
newsapi.apiKey=2397c71979b14eaea433a03179807359
news.fetch.windowHours=36
news.fetch.defaultLimit=12

# ===============================
# 🚀 FLYWAY
# ===============================
spring.flyway.enabled=false

# ===============================
# ✉️ RESEND EMAIL
# ===============================
resend.api.key=${RESEND_API_KEY:dummy-key}

# ===============================
# 🔐 JWT SECRET
# ===============================
jwt.secret=${JWT_SECRET:dev-jwt-secret-change-in-production}

# ===============================
# ☁️ CLOUDINARY
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dev-cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:dev-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:dev-secret}

# ===============================
# 🌐 SERVER CONFIG
# ===============================
server.port=${PORT:8080}
server.servlet.context-path=/